services:
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=mydatabase'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    ports:
      - '5432'

  # Redis guarda o cadastro pendente de confirmação (com TTL).
  # O Spring Boot reconhece a imagem "redis" e configura a conexão sozinho.
  redis:
    image: 'redis:latest'
    ports:
      - '6379'
